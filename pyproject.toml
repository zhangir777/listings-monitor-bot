[project]
name = "listings-monitor-bot"
version = "1.0.0"
description = "Telegram bot that watches Craigslist and Krisha.kz searches and sends new listings (aiogram 3)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31",
    "beautifulsoup4>=4.13",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
